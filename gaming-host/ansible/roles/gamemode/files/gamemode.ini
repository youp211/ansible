; Managed by Ansible (gaming-host). See PERFORMANCE-NOTES.md.
;
; GameMode applies these only while a game is running, then reverts on exit.
; This is what lets the system idle on `powersave` instead of being pinned to
; `performance` 24/7 (which measured 89C package / 92C hottest core under load,
; vs 86C/86C on powersave + hwp_dynamic_boost).

[general]
reaper_freq=5

; Flip to the performance governor for the duration of the game only.
desiredgov=performance
igpu_desiredgov=powersave

; SCHED_ISO is not in mainline kernels; leaving this on just generates log noise.
softrealtime=off

; Raise game thread priority to nice -10 and best-effort-highest I/O priority.
; Requires the RLIMIT_NICE grant in /etc/security/limits.d/99-gaming-nice.conf,
; otherwise these silently fail with "Permission denied".
renice=10
ioprio=0

inhibit_screensaver=1

; kernel.split_lock_mitigate=1 system-wide is correct, but it can stall a game
; that trips split locks. GameMode disables it for the game's lifetime only.
disable_splitlock=1

[filter]

[gpu]
; Deliberately NOT forcing amd_performance_level. Measured at 100% GPU busy and
; 266W against a 265W cap during play - the card is already saturated and power
; limited, so forcing a higher DPM level adds heat without adding headroom.

[cpu]

[supervisor]

