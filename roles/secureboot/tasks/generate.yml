---
# Generating is idempotent and safe: every step is guarded by creates:, so a
# rerun never issues a new PK or KEK. Re-keying the platform is a deliberate act
# (clear firmware keys, delete secureboot_dir, re-run), not something a rerun
# should do by accident.

- name: Create the key directory inside the container
  ansible.builtin.file:
    path: "{{ target_mount }}{{ secureboot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the Platform Key and Key Exchange Key
  # Self-signed, like the MOK. These are policy keys, not signing keys — they
  # authorise changes to the hierarchy and are otherwise unused, which is why
  # they are separate from the key that signs images.
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -new
      - -nodes
      - -utf8
      - -sha256
      - -days
      - "{{ secureboot_days }}"
      - -newkey
      - "rsa:{{ secureboot_key_bits }}"
      - -subj
      - "/CN={{ secureboot_cn_prefix }} {{ item.cn }}/"
      - -keyout
      - "{{ target_mount }}{{ secureboot_dir }}/{{ item.name }}.key"
      - -out
      - "{{ target_mount }}{{ secureboot_dir }}/{{ item.name }}.crt"
    creates: "{{ target_mount }}{{ secureboot_dir }}/{{ item.name }}.key"
  loop:
    - { name: PK, cn: "Platform Key" }
    - { name: KEK, cn: "Key Exchange Key" }
  loop_control:
    label: "{{ item.name }}"

- name: Lock down the private keys
  ansible.builtin.file:
    path: "{{ target_mount }}{{ secureboot_dir }}/{{ item }}.key"
    owner: root
    group: root
    mode: "0600"
  loop: [PK, KEK]

- name: Generate a GUID that owns these signature lists
  # EFI signature lists carry an owner GUID. A stable, machine-specific one makes
  # our entries distinguishable from vendor entries in efi-readvar output.
  ansible.builtin.shell: |
    set -e
    umask 077
    cat /proc/sys/kernel/random/uuid > {{ target_mount }}{{ secureboot_dir }}/GUID
  args:
    creates: "{{ target_mount }}{{ secureboot_dir }}/GUID"

- name: Read the owner GUID back
  ansible.builtin.command: cat {{ target_mount }}{{ secureboot_dir }}/GUID
  register: sb_guid
  changed_when: false

- name: Build the EFI signature lists
  # One .esl per certificate. db may also carry the vendor certs, appended below.
  ansible.builtin.command: >-
    chroot {{ target_mount }} cert-to-efi-sig-list
    -g {{ sb_guid.stdout | trim }}
    {{ item.src }} {{ secureboot_dir }}/{{ item.name }}.esl
  args:
    creates: "{{ target_mount }}{{ secureboot_dir }}/{{ item.name }}.esl"
  loop:
    - { name: PK, src: "{{ secureboot_dir }}/PK.crt" }
    - { name: KEK, src: "{{ secureboot_dir }}/KEK.crt" }
    - { name: db, src: "{{ secureboot_db_cert }}" }
  loop_control:
    label: "{{ item.name }}"

- name: Sign the signature lists into authenticated updates
  # Each variable is signed by its PARENT: db by KEK, KEK by PK, PK by itself.
  # sign-efi-sig-list stamps a timestamp, so these are timed authenticated
  # variable updates and firmware will accept them outside setup mode too.
  ansible.builtin.command: >-
    chroot {{ target_mount }} sign-efi-sig-list
    -g {{ sb_guid.stdout | trim }}
    -k {{ secureboot_dir }}/{{ item.signer }}.key
    -c {{ secureboot_dir }}/{{ item.signer }}.crt
    {{ item.name }} {{ secureboot_dir }}/{{ item.name }}.esl {{ secureboot_dir }}/{{ item.name }}.auth
  args:
    creates: "{{ target_mount }}{{ secureboot_dir }}/{{ item.name }}.auth"
  loop:
    - { name: db, signer: KEK }
    - { name: KEK, signer: PK }
    - { name: PK, signer: PK }
  loop_control:
    label: "{{ item.name }} signed by {{ item.signer }}"

- name: Stage the certificates on the ESP for firmware-side enrolment
  # A fallback route: if efi-updatevar cannot be used, most firmware can enrol a
  # certificate from a file on the ESP.
  ansible.builtin.copy:
    src: "{{ target_mount }}{{ secureboot_dir }}/{{ item }}"
    dest: "{{ target_mount }}{{ uki_esp_mount }}/EFI/keys/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: [PK.crt, KEK.crt, PK.auth, KEK.auth, db.auth]
