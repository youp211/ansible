---
# Secure Boot — replace the factory PK/KEK/db with a hierarchy you own.
# See SECUREBOOT.md for the trust chain, the enrolment order, and recovery.
#
# Split deliberately: generating and staging keys changes no firmware state and
# is safe to run any time. Enrolment writes platform policy, needs firmware
# setup mode, and is gated behind secureboot_enroll.

- name: Secure Boot key ownership disabled (secureboot_enabled=false)
  ansible.builtin.debug:
    msg: >-
      secureboot_enabled=false — the factory key hierarchy is left alone. This
      machine boots whatever its vendor and Microsoft vouched for. See
      SECUREBOOT.md for what owning the keys buys and what it costs.
  when: not secureboot_enabled | bool

- name: Install the key-management tooling
  ansible.builtin.import_tasks: packages.yml
  when: secureboot_enabled | bool

- name: Generate the platform key hierarchy
  ansible.builtin.import_tasks: generate.yml
  when: secureboot_enabled | bool

- name: Enrol the hierarchy into firmware
  ansible.builtin.import_tasks: enroll.yml
  when:
    - secureboot_enabled | bool
    - secureboot_enroll | bool

- name: Report what still needs doing
  ansible.builtin.import_tasks: status.yml
  when: secureboot_enabled | bool
