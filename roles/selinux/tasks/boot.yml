---
- name: Sanity — selinux_cmdline must actually enable SELinux
  # The only switch that works on this kernel. CONFIG_SECURITY_SELINUX_BOOTPARAM
  # is unset in LMDE 7's build, so selinux=1 is an unknown parameter and a
  # cmdline that relies on it silently leaves AppArmor in charge.
  ansible.builtin.assert:
    that: "'security=selinux' in selinux_cmdline"
    fail_msg: >-
      selinux_cmdline does not contain "security=selinux", so nothing on the
      kernel command line would enable SELinux — the first exclusive LSM in
      CONFIG_LSM (apparmor) would win instead. Note that selinux=1 is NOT a
      substitute: CONFIG_SECURITY_SELINUX_BOOTPARAM is not set in this kernel.
      Fix selinux_cmdline in group_vars/all.yml, or set selinux_enabled=false.
    success_msg: "selinux_cmdline enables SELinux."

- name: Ensure /etc/default/grub.d exists in the target
  ansible.builtin.file:
    path: "{{ target_mount }}/etc/default/grub.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Put SELinux on the kernel command line via its own GRUB drop-in
  # Separate from target_config's 90-fde-hardening.cfg so selinux.yml can flip
  # SELinux on a booted system without re-running target_config — i.e. without
  # going near crypttab, fstab or the GRUB password.
  #
  # grub.cfg is regenerated by the caller: finalize.yml's post_tasks, or
  # selinux.yml's.
  ansible.builtin.template:
    src: 91-fde-selinux.cfg.j2
    dest: "{{ target_mount }}/etc/default/grub.d/91-fde-selinux.cfg"
    owner: root
    group: root
    mode: "0644"

- name: Note that the UKI path carries the command line too
  # With uki_enabled the embedded cmdline is the ONLY one that applies —
  # /etc/default/grub is not consulted at all for a chainloaded UKI. update-uki
  # is rendered with selinux_cmdline compiled in for exactly this reason, and
  # both finalize.yml and selinux.yml rebuild the images after this role runs.
  ansible.builtin.debug:
    msg: >-
      uki_enabled=true — the GRUB drop-in is not what will take effect. The UKIs
      are rebuilt after this role with "{{ selinux_cmdline }}" compiled in; if
      you invoked this role on its own, run
      "chroot {{ target_mount }} /usr/local/sbin/update-uki" yourself.
  when: uki_enabled | bool
