---
# Kernel — build an upstream kernel into .debs, sign image and modules with the
# MOK, install, and optionally publish to an apt repo. See KERNEL.md.
#
# Unlike roles/aide and roles/selinux this role is allowed to fail the run: it
# only ever runs from kernel.yml, never from finalize.yml, so there is no boot
# chain half-built behind it. A build that cannot produce a signed kernel should
# say so loudly rather than carry on.

- name: Preflight — build directory, free space, signing prerequisites
  ansible.builtin.import_tasks: preflight.yml
  when: kernel_build_enabled | bool

- name: Install the kernel build toolchain into the target
  ansible.builtin.import_tasks: packages.yml
  when: kernel_build_enabled | bool

- name: Build, sign and package the kernel
  ansible.builtin.import_tasks: build.yml
  when: kernel_build_enabled | bool

- name: Install the built packages
  ansible.builtin.import_tasks: install.yml
  when:
    - kernel_build_enabled | bool
    - kernel_install | bool

- name: Publish the packages to the apt repo (server mode)
  ansible.builtin.import_tasks: publish.yml
  when:
    - kernel_build_enabled | bool
    - kernel_repo_publish | bool

- name: Subscribe this machine to the apt repo (client mode)
  ansible.builtin.import_tasks: client.yml
  when: kernel_repo_client | bool

- name: Kernel build disabled (kernel_build_enabled=false)
  ansible.builtin.debug:
    msg: >-
      kernel_build_enabled=false — no kernel was built. The MOK is still
      generated and still signs UKIs. Build one with
      "ansible-playbook kernel.yml -e target_mount=/ -e kernel_build_enabled=true",
      and read KERNEL.md first: it needs {{ kernel_build_min_free_gib }} GiB on a
      filesystem that is not mounted noexec.
  when: not kernel_build_enabled | bool
