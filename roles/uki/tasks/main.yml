---
- name: UKI disabled (default while installing from media)
  ansible.builtin.debug:
    msg: >-
      uki_enabled=false — GRUB boots the classic kernel+initrd from /boot.
      Flip uki_enabled in group_vars/all.yml and re-run finalize.yml later to
      switch to chainloaded Unified Kernel Images on the ESP.
  when: not uki_enabled | bool

- name: Configure Unified Kernel Images (GRUB chainload)
  when: uki_enabled | bool
  block:
    - name: Install UKI tooling into the target
      ansible.builtin.command: >-
        chroot {{ target_mount }} env DEBIAN_FRONTEND=noninteractive
        apt-get install -y {{ uki_packages | join(' ') }}
      register: uki_apt
      changed_when: "'0 newly installed' not in uki_apt.stdout"

    - name: Generate the PCR signing keypair
      # A THIRD key, separate from the MOK and from PK/KEK. It signs PREDICTED
      # PCR 11 values, not images — so stealing it lets an attacker make a
      # tampered image unseal, but not boot one. Different blast radius,
      # therefore a different key. creates: so a rerun never re-keys: a new key
      # would invalidate every signature already embedded in every UKI.
      ansible.builtin.command:
        argv:
          - openssl
          - genrsa
          - -out
          - "{{ target_mount }}{{ uki_pcr_key }}"
          - "{{ uki_pcr_key_bits }}"
        creates: "{{ target_mount }}{{ uki_pcr_key }}"
      when: uki_pcr_sign | bool

    - name: Lock down the PCR signing key
      ansible.builtin.file:
        path: "{{ target_mount }}{{ uki_pcr_key }}"
        owner: root
        group: root
        mode: "0600"
      when: uki_pcr_sign | bool

    - name: Publish the PCR public key beside its private half
      ansible.builtin.shell: |
        set -o pipefail
        umask 022
        openssl rsa -in {{ target_mount }}{{ uki_pcr_key }} -pubout \
          -out {{ target_mount }}{{ uki_pcr_pub }}
      args:
        executable: /bin/bash
        creates: "{{ target_mount }}{{ uki_pcr_pub }}"
      when: uki_pcr_sign | bool

    - name: Install the UKI build script
      ansible.builtin.template:
        src: update-uki.j2
        dest: "{{ target_mount }}/usr/local/sbin/update-uki"
        owner: root
        group: root
        mode: "0755"

    - name: Ensure kernel hook directories exist
      ansible.builtin.file:
        path: "{{ target_mount }}/etc/kernel/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - postinst
        - postrm

    - name: Rebuild UKIs on every kernel install/remove
      ansible.builtin.template:
        src: kernel-hook.j2
        dest: "{{ target_mount }}/etc/kernel/{{ item }}.d/zz-update-uki"
        owner: root
        group: root
        mode: "0755"
      loop:
        - postinst
        - postrm

    - name: Install GRUB menu generator for UKIs
      ansible.builtin.template:
        src: 25_uki.j2
        dest: "{{ target_mount }}/etc/grub.d/25_uki"
        owner: root
        group: root
        mode: "0755"

    - name: Build UKIs for every installed kernel
      # update-uki skips images that are already current, so report changed only
      # when it actually rebuilt something. "changed_when: true" here was the
      # last task keeping selinux.yml from a clean idempotent rerun.
      ansible.builtin.command: chroot {{ target_mount }} /usr/local/sbin/update-uki
      register: uki_build
      changed_when: "'rebuilt 0 image' not in uki_build.stdout"
