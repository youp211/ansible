---
# CONFIG CONTRACT
# ---------------
# group_vars/all.yml is the single source of truth for every tunable. The roles
# reference variables bare — no inline `| default(...)` — so that changing a
# value in group_vars is guaranteed to take effect everywhere, with no second
# definition hidden in a task that could silently win.
#
# The cost of that rule is that a group_vars file older than the roles (e.g.
# after extracting an updated tarball over an edited config) would otherwise
# blow up somewhere deep in a run. This task catches it in the first two
# seconds and names the exact keys to add.

- name: Config contract — every required variable must be defined
  ansible.builtin.assert:
    # Bare expression, not "{{ ... }}": ansible-core deprecated templating
    # delimiters around conditionals and removes them in 2.23. This role gates
    # every playbook in the tree, so it is the worst possible place to inherit a
    # scheduled breakage.
    that: required_vars | reject('in', vars) | list | length == 0
    fail_msg: >-
      group_vars/all.yml is missing:
      {{ required_vars | reject('in', vars) | list | join(', ') }}.
      This usually means the playbook tree was updated but the config was not.
      Add the missing keys (see the shipped group_vars/all.yml for documented
      values) and re-run.
    success_msg: "Config contract satisfied ({{ required_vars | length }} keys)."
  vars:
    required_vars:
      # identity + interlock
      - target_disk
      - vg_name
      - luks_name
      - lvs
      # filesystem / mount policy
      - boot_mount_opts
      - esp_mount_opts
      - shm_mount_opts
      - f2fs_mkfs_features
      - fscrypt_install_pam
      - fscrypt_configure
      # boot chain
      - hibernate_enabled
      - kernel_cmdline_hardening
      - grub_disable_os_prober
      - grub_password_pbkdf2
      - grub_superuser
      - boot_disable_plymouth
      - boot_strip_quiet
      # tpm2
      - tpm2_enroll
      - tpm2_pcrs
      - tpm2_public_key_pcrs
      - tpm2_reenroll
      - tpm2_require_initramfs_token
      - tpm2_boot_tries
      - tpm2_boot_unlock
      # uki
      - uki_enabled
      - uki_esp_mount
      - uki_dir
      - uki_retain
      - uki_pcr_sign
      - uki_pcr_key
      - uki_pcr_pub
      - uki_pcr_key_bits
      - uki_pcr_phases
      - uki_sign
      - uki_sign_key
      - uki_sign_cert
      - uki_efi_entry
      - uki_efi_label
      - uki_efi_default
      # secrets policy (the values themselves are prompted, see secrets.yml)
      - luks_passphrase_min_length
      - tpm2_pin_min_length
      - mok_password_length
      # mok (signing key: UKIs, kernel images, modules)
      - mok_enabled
      - mok_dir
      - mok_key
      - mok_cert
      - mok_der
      - mok_pem
      - mok_cn
      - mok_days
      - mok_key_bits
      - mok_enroll
      # secure boot (platform key ownership)
      - secureboot_enabled
      - secureboot_dir
      - secureboot_db_cert
      - secureboot_cn_prefix
      - secureboot_days
      - secureboot_key_bits
      - secureboot_keep_vendor_db
      - secureboot_require_bootable
      - secureboot_enroll
      - secureboot_packages
      # kernel build
      - kernel_build_enabled
      - kernel_version
      - kernel_localversion
      - kernel_seed_config
      - kernel_build_dir
      - kernel_build_min_free_gib
      - kernel_debug_info
      - kernel_build_dbg_package
      - kernel_sign_image
      - kernel_sign_modules
      - kernel_install
      - kernel_keep_all
      - kernel_build_packages
      # kernel repo: server mode (publish) + client mode (consume)
      - kernel_repo_publish
      - kernel_repo_host
      - kernel_repo_user
      - kernel_repo_ssh_key
      - kernel_repo_incoming
      - kernel_repo_basedir
      - kernel_repo_suite
      - kernel_repo_client
      - kernel_repo_url
      - kernel_repo_components
      - kernel_repo_gpg_key
      # selinux
      - selinux_enabled
      - selinux_mode
      - selinux_policy_type
      - selinux_relabel_mode
      - selinux_cmdline
      - selinux_disable_apparmor
      - selinux_install_auditd
      - selinux_booleans
      - selinux_packages
      - selinux_audit_packages
      # aide
      - aide_enabled
      - aide_packages
      - aide_exclude_paths
      - aide_boot_limit
      - aide_boot_check
      - aide_boot_check_wall
      - aide_boot_accept_on_kernel_update
      - aide_accept_hook_dirs
      - aide_init_mode
      - aide_daily_enabled
      - aide_daily_command
      - aide_daily_copynewdb
      - aide_mailto
      - aide_require_config_check
      # finalize behaviour + packages
      - target_mount
      - finalize_teardown
      - target_packages
      - target_packages_pam
      - target_packages_extra
      - uki_packages

- name: Config contract — enumerated values must be valid
  ansible.builtin.assert:
    that:
      - tpm2_boot_unlock in ['always', 'cmdline', 'never']
      - aide_init_mode in ['firstboot', 'now', 'never']
      - aide_daily_command in ['check', 'update']
      - aide_daily_copynewdb | string in ['no', 'yes', 'ifnochange']
      - selinux_mode in ['permissive', 'enforcing']
      - selinux_policy_type in ['default', 'mls']
      - selinux_relabel_mode in ['auto', 'always', 'never']
      # The MOK is the root of the signing chain; a too-small or too-short-lived
      # key is a footgun that only shows up years later.
      - mok_key_bits | int >= 2048
      - mok_days | int >= 365
    fail_msg: >-
      Invalid enumerated value. tpm2_boot_unlock must be one of
      always/cmdline/never (got '{{ tpm2_boot_unlock }}'); aide_init_mode one of
      firstboot/now/never (got '{{ aide_init_mode }}'); aide_daily_command one of
      check/update (got '{{ aide_daily_command }}'); aide_daily_copynewdb one of
      no/yes/ifnochange, quoted so YAML does not turn it into a boolean
      (got '{{ aide_daily_copynewdb }}'); selinux_mode one of
      permissive/enforcing — "disabled" is deliberately illegal, turn SELinux
      off with selinux_enabled=false instead, because the kernel dropped
      runtime disable in 6.4 (got '{{ selinux_mode }}'); selinux_policy_type
      one of default/mls (got '{{ selinux_policy_type }}');
      selinux_relabel_mode one of auto/always/never
      (got '{{ selinux_relabel_mode }}'); mok_key_bits must be at least 2048
      (got {{ mok_key_bits }}) and mok_days at least 365
      (got {{ mok_days }}) — the MOK is the root of the signing chain and
      re-keying invalidates every UKI, kernel and module it has signed.

- name: Secrets contract — prompted values, checked before anything uses them
  ansible.builtin.import_tasks: secrets.yml
