---
# SECRETS CONTRACT
# ----------------
# The three secrets in this tree are prompted per-playbook, not stored in
# group_vars, so they cannot be checked by the required-variable assert above.
# They are checked here instead — before any of them is used, so a too-short
# passphrase fails in the first two seconds rather than after it has already
# been written into a LUKS2 keyslot you then have to live with.
#
# Each check is gated on the variable being DEFINED rather than defaulted:
# aide.yml and selinux.yml also run this role and prompt for nothing, and a
# `| default('')` here would quietly turn "not asked for" into "empty".
#
# The three values are deliberately different from one another. Why, and what
# each one is actually protecting: README "Secrets".
#
# NOTE: none of these asserts carries no_log, and that is deliberate. A failing
# assert prints the ASSERTION EXPRESSION ("tpm2_pin | length >= ...") and never
# the evaluated value — verified at -vvv. Adding no_log here would censor the
# fail_msg instead, which is the one thing the operator actually needs to read.

- name: Secrets contract — the prompts actually ran
  # vars_prompt needs a TTY. Run non-interactively (a wrapper script, a CI
  # runner, or a shell that is not a terminal) ansible prints
  # "Not prompting as we are not in interactive mode" and the variable comes
  # through as the literal STRING "None" — four characters, not empty, not the
  # None object. So a bare emptiness test passes and the length check below then
  # blames the passphrase for being short, which sends you looking in entirely
  # the wrong place. Measured: type=str len=4 value="None".
  ansible.builtin.assert:
    that:
      - item.value | length > 0
      - item.value != 'None'
    fail_msg: >-
      {{ item.key }} was never collected. Ansible logs "Not prompting as we are not in
      interactive mode" when vars_prompt has no TTY, and this playbook needs
      one. Run it directly in a terminal rather than through a wrapper or a
      non-interactive shell. Do NOT pass it with -e: extra-vars land on the
      connection plugin's command line, which no_log does not suppress.
    success_msg: "{{ item.key }} was collected."
  # Parenthesised on both sides on purpose: "A if c else [] + (B if d else [])"
  # parses as "A if c else ([] + ...)", which silently drops the second entry
  # whenever the first condition is true.
  loop: >-
    {{ ([{'key': 'luks_passphrase', 'value': luks_passphrase}] if luks_passphrase is defined else [])
     + ([{'key': 'tpm2_pin', 'value': tpm2_pin}] if tpm2_pin is defined else []) }}
  loop_control:
    label: "{{ item.key }}"

- name: Secrets contract — the LUKS recovery passphrase is long enough
  ansible.builtin.assert:
    that: luks_passphrase | length >= luks_passphrase_min_length | int
    fail_msg: >-
      The LUKS recovery passphrase is shorter than
      {{ luks_passphrase_min_length }} characters. This is the offline
      break-glass: it is what stands between a stolen disk and its contents,
      with no rate limiting of any kind behind it — only argon2id's cost. Use a
      longer one, or lower luks_passphrase_min_length in group_vars/all.yml if
      you have decided otherwise.
    success_msg: "Recovery passphrase meets the {{ luks_passphrase_min_length }}-character minimum."
  when: luks_passphrase is defined

- name: Secrets contract — the TPM2 PIN is long enough
  ansible.builtin.assert:
    that: tpm2_pin | length >= tpm2_pin_min_length | int
    fail_msg: >-
      The TPM2 PIN is shorter than {{ tpm2_pin_min_length }} characters. It may
      reasonably be short — the TPM's dictionary-attack lockout rate-limits
      guesses in a way the LUKS keyslot has no equivalent of — but not this
      short. Raise it, or lower tpm2_pin_min_length in group_vars/all.yml.
    success_msg: "TPM2 PIN meets the {{ tpm2_pin_min_length }}-character minimum."
  when: tpm2_pin is defined

- name: Secrets contract — the PIN must not be the recovery passphrase
  # Reusing it would mean one shoulder-surfed boot hands over full offline
  # access to the disk: the PIN is typed at every boot, the passphrase is the
  # thing that protects it at rest, and the TPM's anti-hammering does not extend
  # to the LUKS keyslot.
  ansible.builtin.assert:
    that: tpm2_pin != luks_passphrase
    fail_msg: >-
      The TPM2 PIN and the LUKS recovery passphrase are the same value. The PIN
      is typed at every boot and is shoulder-surfable; the passphrase is the
      offline break-glass behind argon2id. Making them identical means anyone
      who watches one boot can decrypt the disk offline, and the TPM's
      dictionary-attack lockout does not protect the LUKS keyslot. Use two
      different values — see README "Secrets".
    success_msg: "PIN and recovery passphrase are distinct."
  when:
    - tpm2_pin is defined
    - luks_passphrase is defined
