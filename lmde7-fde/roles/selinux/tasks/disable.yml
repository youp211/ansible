---
# selinux_enabled=false is an active undo, not a skip. Everything this role
# writes is removed and AppArmor is put back, so flipping the flag either way
# never strands the box with no MAC at all.
#
# Note what is NOT done here: SELINUX=disabled is never written to
# /etc/selinux/config. CONFIG_SECURITY_SELINUX_DISABLE was removed from the
# kernel in 6.4 and is absent from LMDE 7's build, so that setting is a no-op
# that reads like a guarantee. Removing security=selinux from the command line
# is the disable.

- name: Remove the SELinux GRUB drop-in
  # grub.cfg is regenerated by the caller (finalize.yml / selinux.yml post_tasks).
  ansible.builtin.file:
    path: "{{ target_mount }}/etc/default/grub.d/91-fde-selinux.cfg"
    state: absent

- name: Cancel any pending relabel
  # Without security=selinux the autorelabel generator never fires, so the flag
  # would sit there forever and re-trigger a full relabel the day someone turns
  # SELinux back on for an unrelated reason.
  ansible.builtin.file:
    path: "{{ target_mount }}/.autorelabel"
    state: absent

- name: Look for the AppArmor unit in the target
  ansible.builtin.stat:
    path: "{{ target_mount }}/usr/lib/systemd/system/apparmor.service"
  register: selinux_aa_unit_off

- name: Give the LSM slot back to AppArmor
  when: selinux_aa_unit_off.stat.exists
  block:
    - name: Unmask apparmor.service
      ansible.builtin.command: chroot {{ target_mount }} systemctl unmask apparmor.service
      register: selinux_aa_unmask
      failed_when: false
      changed_when: "'Removed' in (selinux_aa_unmask.stderr + selinux_aa_unmask.stdout)"

    - name: Enable apparmor.service
      ansible.builtin.command: chroot {{ target_mount }} systemctl enable apparmor.service
      register: selinux_aa_enable
      failed_when: false
      changed_when: "'Created symlink' in (selinux_aa_enable.stderr + selinux_aa_enable.stdout)"

- name: Make the unit changes visible to a running systemd
  ansible.builtin.command: chroot {{ target_mount }} systemctl daemon-reload
  changed_when: true
  when: target_mount == '/'

- name: SELinux disabled
  ansible.builtin.debug:
    msg:
      - "selinux_enabled=false — SELinux is NOT on the kernel command line."
      - "AppArmor is unmasked and enabled; it takes the LSM slot at the next boot."
      - "The policy packages are left installed (removing them is not this role's call)."
      - "Reboot for the change to take effect, then confirm with: aa-enabled ; sestatus"
