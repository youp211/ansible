---
- name: Create the key directory inside the container
  # 0700 on the root LV: the private key is only as safe as the LUKS2 volume it
  # sits on, and that is the strongest guarantee available here.
  ansible.builtin.file:
    path: "{{ target_mount }}{{ mok_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether a MOK already exists
  ansible.builtin.stat:
    path: "{{ target_mount }}{{ mok_key }}"
  register: mok_existing

- name: Generate the MOK keypair and self-signed certificate
  # -nodes (no passphrase): the key has to be usable unattended by the kernel
  # build's modules_install step and by update-uki's kernel hook. Its protection
  # is the LUKS2 container plus 0600, not a passphrase nobody would be there to
  # type. Cert basicConstraints/keyUsage are what shim and the kernel's module
  # verifier expect of a code-signing MOK.
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -new
      - -nodes
      - -utf8
      - -sha256
      - -days
      - "{{ mok_days }}"
      - -newkey
      - "rsa:{{ mok_key_bits }}"
      - -subj
      - "/CN={{ mok_cn }}/"
      - -addext
      - "basicConstraints=critical,CA:FALSE"
      - -addext
      - "keyUsage=digitalSignature"
      - -addext
      - "extendedKeyUsage=codeSigning"
      - -keyout
      - "{{ target_mount }}{{ mok_key }}"
      - -out
      - "{{ target_mount }}{{ mok_cert }}"
    creates: "{{ target_mount }}{{ mok_key }}"

- name: Lock down the private key
  ansible.builtin.file:
    path: "{{ target_mount }}{{ mok_key }}"
    owner: root
    group: root
    mode: "0600"

- name: Publish the certificate in the two other forms the toolchain wants
  ansible.builtin.file:
    path: "{{ target_mount }}{{ mok_cert }}"
    owner: root
    group: root
    mode: "0644"

- name: Derive the DER certificate (the form mokutil enrolls)
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -outform
      - DER
      - -in
      - "{{ target_mount }}{{ mok_cert }}"
      - -out
      - "{{ target_mount }}{{ mok_der }}"
    creates: "{{ target_mount }}{{ mok_der }}"

- name: Derive the combined PEM (CONFIG_MODULE_SIG_KEY wants key and cert in one file)
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    cat {{ target_mount }}{{ mok_key }} {{ target_mount }}{{ mok_cert }} > {{ target_mount }}{{ mok_pem }}
  args:
    executable: /bin/bash
    creates: "{{ target_mount }}{{ mok_pem }}"

- name: Lock down the combined PEM (it contains the private key)
  ansible.builtin.file:
    path: "{{ target_mount }}{{ mok_pem }}"
    owner: root
    group: root
    mode: "0600"

- name: Read back the certificate the rest of the chain will trust
  ansible.builtin.command: >-
    openssl x509 -noout -subject -fingerprint -sha256 -dates
    -in {{ target_mount }}{{ mok_cert }}
  register: mok_fingerprint
  changed_when: false

- name: Show the MOK identity
  ansible.builtin.debug:
    msg: >-
      {{ ('Generated a new MOK.' if not mok_existing.stat.exists
          else 'Reusing the existing MOK (never regenerated by a rerun).')
      }} {{ mok_fingerprint.stdout_lines }}
