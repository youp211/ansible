---
# TPM2 RE-ENROLMENT — rebind the LUKS2 keyslot to the current PCR set.
#
#   sudo ansible-playbook tpm2.yml -e target_mount=/
#
# Needed whenever the measurements the keyslot is sealed against change:
#   * PCR 7  moves when Secure Boot policy changes — enabling SB, or replacing
#            PK/KEK/db (secureboot.yml does exactly that)
#   * PCR 11 moves on every kernel or initrd change, because systemd-stub
#            measures the UKI's own sections into it
#
# SEQUENCING TRAP, and why this playbook refuses rather than guesses:
# systemd-cryptenroll seals against the PCR values of the RUNNING system. If the
# UKI is rebuilt after enrolling — or if you are running an older image than the
# newest on the ESP — then PCR 11 at the next boot will not match what was
# sealed, and the TPM silently refuses to unseal. So this asserts that the image
# you are booted from is the newest one on the ESP, and that nothing rebuilt it
# during this run, before it touches the keyslot.

- name: "TPM2: rebind the keyslot to the current PCRs"
  hosts: live
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "LUKS recovery passphrase (authorises the re-enrollment against keyslot 0)"
      private: true
    - name: tpm2_pin
      prompt: "TPM2 PIN to require at every boot"
      private: true
      confirm: true

  pre_tasks:

    - name: Read the UKI the firmware actually loaded
      ansible.builtin.shell: |
        set -o pipefail
        for f in /sys/firmware/efi/efivars/LoaderImageIdentifier-*; do
          [ -e "$f" ] || continue
          dd if="$f" bs=1 skip=4 2>/dev/null | iconv -f UTF-16LE -t UTF-8 2>/dev/null | tr -d '\0'
          break
        done
      args:
        executable: /bin/bash
      register: tpm2_running_uki
      changed_when: false

    - name: Find the newest UKI on the ESP
      ansible.builtin.shell: |
        set -o pipefail
        shopt -s nullglob
        all="$(printf '%s\n' {{ uki_esp_mount }}/{{ uki_dir }}/*.efi | sort -V -r)"
        printf '%s' "${all%%$'\n'*}"
      args:
        executable: /bin/bash
      register: tpm2_newest_uki
      changed_when: false

    - name: Assert you are booted from the image you are about to seal against
      # PCR 11 measures the running image. Sealing while booted from anything
      # other than the image the machine will boot next produces a keyslot that
      # can never unseal — and the failure is silent, at the worst moment.
      ansible.builtin.assert:
        that: >-
          tpm2_running_uki.stdout | trim | length == 0
          or (tpm2_newest_uki.stdout | trim | basename) == (tpm2_running_uki.stdout | trim | replace('\\', '/') | basename)
        fail_msg: >-
          Booted from "{{ tpm2_running_uki.stdout | trim }}" but the newest image
          on the ESP is "{{ tpm2_newest_uki.stdout | trim | basename }}". Sealing
          now would bind the keyslot to PCR 11 of an image you are about to stop
          booting, and the TPM would refuse to unseal at the next boot. Reboot
          into the newest UKI first, then re-run.
        success_msg: >-
          {{ 'Running the newest UKI — PCR 11 will match at the next boot.'
          if tpm2_running_uki.stdout | trim | length > 0
          else 'Not booted via a UKI; PCR 11 binding only makes sense on the UKI path.' }}
      when: tpm2_pcrs is search('11')

  roles:
    - config_contract

  tasks:
    - name: Re-enrol the TPM2 keyslot
      ansible.builtin.include_role:
        name: tpm2_enroll

  post_tasks:
    - name: Show the resulting token
      ansible.builtin.shell: |
        set -o pipefail
        cryptsetup luksDump {{ part_prefix }}3 | sed -n '/Tokens:/,/^$/p'
      args:
        executable: /bin/bash
      register: tpm2_token_dump
      changed_when: false

    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "{{ tpm2_token_dump.stdout_lines }}"
          - "Sealed against PCRs {{ tpm2_pcrs }}. Reboot and confirm it asks for the PIN, not the passphrase."
          - >-
            {{ 'PCR 11 is included, so EVERY kernel or initrd change invalidates this
            binding — re-run tpm2.yml after each. A signed PCR policy
            (--tpm2-public-key) is the way out of that and is not wired up yet.'
            if tpm2_pcrs is search('11') else '' }}
          - "The recovery passphrase in keyslot 0 always works regardless."
