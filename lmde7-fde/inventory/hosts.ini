# Default inventory: this machine, managed locally.
#
# The host is named `workstation`, NOT `localhost`, and that is load-bearing.
# Ansible matches host_vars/ by INVENTORY HOSTNAME, so calling it "localhost"
# here would make every override in host_vars/workstation.yml silently inert on
# local runs and fall back to group_vars/all.yml. inventory/remote.ini uses the
# same name, so the two agree on identity and it does not matter which one you
# reach the box through.
[live]
workstation ansible_connection=local
