# Separate inventory ON PURPOSE. Adding this entry to inventory/hosts.ini would
# put it in the same [live] group as the local connection, and every playbook is
# "hosts: live" — one forgotten -l and a run lands on both machines at once.
# Selecting the remote must be an explicit act: -i inventory/remote.ini
#
# The hostname MUST match inventory/hosts.ini: host_vars/ is keyed on the
# inventory name, so the box must resolve to the same host_vars/workstation.yml
# whether you reach it locally or over SSH.
[live]
workstation ansible_host=192.0.2.10 ansible_user=youruser
