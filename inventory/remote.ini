# Separate inventory ON PURPOSE. Adding the remote to inventory/hosts.ini would
# put it in the same [live] group as localhost, and every playbook here is
# "hosts: live" — one forgotten -l and a run lands on both machines at once.
# Selecting the remote must be an explicit act: -i inventory/remote.ini
[live]
mason-pc ansible_host=192.168.0.97 ansible_user=mason
